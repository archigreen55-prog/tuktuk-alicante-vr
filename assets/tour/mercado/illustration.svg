<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Mercado Central">
  <!-- TukTuk · власна ілюстрація (agent-svg) · Mercado Central: модерновий фасад зі ступінчастим фронтоном, аркою і сходами -->
  <g stroke="#2B2D42" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="64" cy="118" rx="56" ry="6" fill="#2B2D42" fill-opacity=".16" stroke="none"/>
    <!-- корпус -->
    <rect x="10" y="60" width="108" height="42" fill="#EBCBA6"/>
    <!-- вертикальні вікна-смуги -->
    <g stroke-width="2.5" fill="#8A5A3C">
      <rect x="17" y="68" width="5" height="22"/><rect x="27" y="68" width="5" height="22"/>
      <rect x="96" y="68" width="5" height="22"/><rect x="106" y="68" width="5" height="22"/>
    </g>
    <!-- ступінчастий фронтон -->
    <path d="M36 60 v-14 h8 v-8 h8 v-8 h24 v8 h8 v8 h8 v14 z" fill="#F3DDC2"/>
    <!-- башточки-шпилі -->
    <path d="M40 46 v-8 h6 v8" fill="#F3DDC2"/><path d="M82 46 v-8 h6 v8" fill="#F3DDC2"/>
    <path d="M58 30 v-10 h12 v10" fill="#F3DDC2"/>
    <circle cx="64" cy="14" r="4" fill="#D9734E"/>
