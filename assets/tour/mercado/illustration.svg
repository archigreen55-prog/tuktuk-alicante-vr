    <!-- годинник -->
    <circle cx="64" cy="40" r="5" fill="#FFFDF7" stroke-width="2.5"/>
    <!-- сходи -->
    <path d="M38 102 h52 v5 h-52 z" fill="#F3DDC2" stroke-width="2.5"/>
    <path d="M32 107 h64 v5 h-64 z" fill="#F3DDC2" stroke-width="2.5"/>
