    <path d="M114 102 q-1 -16 2 -30" fill="none" stroke-width="3"/>
    <path d="M116 72 q-10 -6 -18 2 M116 72 q8 -8 12 -2 M116 72 q-2 -10 -10 -12" fill="none" stroke="#5E9A5A" stroke-width="3.5"/>
