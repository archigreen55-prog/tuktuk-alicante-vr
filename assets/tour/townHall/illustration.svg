    <path d="M94 36 q12 -18 24 0 z" fill="#8EC5E0"/>
    <line x1="22" y1="27" x2="22" y2="18"/><line x1="106" y1="27" x2="106" y2="18"/>
    <!-- балкони і вікна -->
    <g fill="#2B2D42" stroke-width="2">
      <rect x="17" y="50" width="10" height="14" rx="5"/><rect x="101" y="50" width="10" height="14" rx="5"/>
      <rect x="40" y="64" width="10" height="14" rx="5"/><rect x="59" y="64" width="10" height="14" rx="5"/><rect x="78" y="64" width="10" height="14" rx="5"/>
    </g>
    <path d="M36 80 h56" fill="none" stroke-width="3"/>
