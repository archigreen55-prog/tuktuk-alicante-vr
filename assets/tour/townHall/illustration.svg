    <ellipse cx="64" cy="118" rx="56" ry="6" fill="#2B2D42" fill-opacity=".16" stroke="none"/>
    <!-- центральний корпус -->
    <rect x="30" y="54" width="68" height="54" fill="#E3C79A"/>
    <!-- дві вежі по краях -->
    <rect x="10" y="36" width="24" height="72" fill="#D9B98B"/>
    <rect x="94" y="36" width="24" height="72" fill="#D9B98B"/>
