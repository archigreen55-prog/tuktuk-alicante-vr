<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Palacio Provincial — Diputación">
  <!-- TukTuk · власна ілюстрація (agent-svg), заглушка до підтвердження точки · неокласичний палац з портиком і прапором -->
  <g stroke="#2B2D42" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="64" cy="118" rx="56" ry="6" fill="#2B2D42" fill-opacity=".16" stroke="none"/>
    <!-- корпус -->
    <rect x="12" y="50" width="104" height="58" fill="#FFF4E0"/>
    <!-- портик з колонами -->
    <path d="M36 50 h56 l-28 -16 z" fill="#EFD9B4"/>
    <g fill="#FFFDF7">
      <rect x="40" y="54" width="7" height="54"/><rect x="54" y="54" width="7" height="54"/>
      <rect x="67" y="54" width="7" height="54"/><rect x="81" y="54" width="7" height="54"/>
    </g>
    <!-- вікна по боках -->
    <g fill="#8EC5E0" stroke-width="2.5">
      <rect x="18" y="60" width="10" height="14"/><rect x="18" y="84" width="10" height="14"/>
      <rect x="100" y="60" width="10" height="14"/><rect x="100" y="84" width="10" height="14"/>
    </g>
    <!-- вхід -->
    <rect x="59" y="90" width="10" height="18" fill="#8A5A3C"/>
    <!-- прапор -->
    <line x1="64" y1="34" x2="64" y2="14"/>
    <path d="M64 14 l14 4 l-14 4 z" fill="#F6C343"/>
  </g>
</svg>
