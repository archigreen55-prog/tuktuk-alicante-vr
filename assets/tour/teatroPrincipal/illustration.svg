<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Teatro Principal">
  <!-- TukTuk · власна ілюстрація (agent-svg), заглушка до підтвердження точки · театр XIX ст.: шість колон, фронтон, маски -->
  <g stroke="#2B2D42" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="64" cy="118" rx="54" ry="6" fill="#2B2D42" fill-opacity=".16" stroke="none"/>
    <!-- сходи -->
    <path d="M14 108 h100 v-6 h-100 z" fill="#E3C79A"/>
    <!-- корпус і фронтон -->
    <rect x="18" y="48" width="92" height="54" fill="#EFD9B4"/>
    <path d="M14 48 h100 l-50 -22 z" fill="#FFF4E0"/>
    <!-- колони -->
    <g fill="#FFFDF7">
      <rect x="24" y="52" width="7" height="50"/><rect x="38" y="52" width="7" height="50"/><rect x="52" y="52" width="7" height="50"/>
      <rect x="69" y="52" width="7" height="50"/><rect x="83" y="52" width="7" height="50"/><rect x="97" y="52" width="7" height="50"/>
    </g>
    <!-- маски на фронтоні -->
    <circle cx="57" cy="40" r="4" fill="#F6C343" stroke-width="2"/>
    <circle cx="71" cy="40" r="4" fill="#D9734E" stroke-width="2"/>
    <!-- вхід -->
    <path d="M58 102 v-14 q6 -8 12 0 v14 z" fill="#8A5A3C"/>
  </g>
</svg>
