<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Casa Carbonell">
  <!-- TukTuk · власна ілюстрація (agent-svg) · Casa Carbonell: білий палац з куполами біля моря -->
  <g stroke="#2B2D42" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <ellipse cx="64" cy="118" rx="54" ry="6" fill="#2B2D42" fill-opacity=".16" stroke="none"/>
    <!-- море -->
    <path d="M6 112 q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t16 0 t8 0" fill="none" stroke="#8EC5E0" stroke-width="4"/>
    <!-- бічні крила -->
    <rect x="12" y="62" width="30" height="46" fill="#FFFDF7"/>
    <rect x="86" y="62" width="30" height="46" fill="#FFFDF7"/>
    <!-- центральний корпус -->
    <rect x="38" y="50" width="52" height="58" fill="#FFF4E0"/>
    <!-- куполи -->
    <path d="M44 50 q20 -34 40 0 z" fill="#8EC5E0"/>
    <line x1="64" y1="21" x2="64" y2="12"/>
    <path d="M16 62 q11 -18 22 0 z" fill="#8EC5E0"/>
    <path d="M90 62 q11 -18 22 0 z" fill="#8EC5E0"/>
    <!-- вікна -->
    <g fill="#F6C343" stroke-width="2.5">
      <rect x="18" y="72" width="7" height="10" rx="3"/><rect x="29" y="72" width="7" height="10" rx="3"/>
      <rect x="18" y="90" width="7" height="10" rx="3"/><rect x="29" y="90" width="7" height="10" rx="3"/>
      <rect x="92" y="72" width="7" height="10" rx="3"/><rect x="103" y="72" width="7" height="10" rx="3"/>
      <rect x="92" y="90" width="7" height="10" rx="3"/><rect x="103" y="90" width="7" height="10" rx="3"/>
      <rect x="45" y="60" width="8" height="12" rx="4"/><rect x="60" y="60" width="8" height="12" rx="4"/><rect x="75" y="60" width="8" height="12" rx="4"/>
      <rect x="45" y="78" width="8" height="12" rx="4"/><rect x="75" y="78" width="8" height="12" rx="4"/>
    </g>
    <!-- вхід -->
    <path d="M57 108 v-14 q7 -9 14 0 v14 z" fill="#D9734E"/>
