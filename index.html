<script>
  // Early diagnostics (phone stage F0, docs/plan-phone.md): a classic script, so it also works when
  // the modules fail to load (blocked CDN, syntax error). Always on: window errors -> a red line at the
  // top ("tap for details"). Only on a phone, or with ?diag / ?bench: console lines are kept for the
  // report. ?ui=phone / ?ui=desktop force the interface; by default a touch screen without hover is a phone.
  (() => {
    const q = new URLSearchParams(location.search);
    const forced = q.get('ui');
    const coarse = matchMedia('(pointer: coarse)').matches && matchMedia('(hover: none)').matches;
    const ui = forced === 'phone' || forced === 'desktop' ? forced : coarse ? 'phone' : 'desktop';
    const diagOn = ui === 'phone' || q.has('diag') || q.has('bench');
    const D = window.__diag = { ui, diagOn, errors: [], log: [], t0: performance.now(), openPanel: null, banner: null };
    document.documentElement.classList.add('ui-' + ui);   // CSS hooks: html.ui-phone
    const stamp = () => ((performance.now() - D.t0) / 1000).toFixed(1) + 's';
    const text = (v) => (v && (v.stack || v.message)) || String(v);
    function showBanner() {
      if (!D.banner) {
        const b = D.banner = document.createElement('div');
        b.style.cssText = 'position:fixed;left:50%;top:6px;transform:translateX(-50%);max-width:min(92vw,720px);z-index:200;padding:6px 12px;border-radius:8px;background:#b3261e;color:#fff;font:13px/1.35 system-ui,sans-serif;box-shadow:0 2px 8px rgba(0,0,0,.4);cursor:pointer;touch-action:manipulation;overflow:hidden;text-overflow:ellipsis;white-space:nowrap';
        b.addEventListener('click', () => (D.openPanel ? D.openPanel() : fallbackPanel()));
        (document.body || document.documentElement).appendChild(b);
      }
      const last = D.errors[D.errors.length - 1];
      D.banner.textContent = `⚠ Помилка${D.errors.length > 1 ? ` (${D.errors.length})` : ''}: ${last.msg.split('\n')[0].slice(0, 160)} — торкнись, щоб побачити`;
    }
    // before the modules are up: a bare text box with the errors to copy
    function fallbackPanel() {
      const t = document.createElement('textarea');
      t.readOnly = true;
      t.value = `Tuk-Tuk Alicante, помилки (модулі не запустились)\n${location.href}\n${navigator.userAgent}\n\n` + D.errors.map((e) => `[${e.t}] ${e.msg}`).join('\n\n');
      t.style.cssText = 'position:fixed;inset:8px;z-index:300;font:12px/1.35 ui-monospace,monospace;background:#111;color:#eee;border:2px solid #b3261e;border-radius:8px;padding:8px';
      t.addEventListener('dblclick', () => t.remove());
      document.body.appendChild(t); t.focus(); t.select();
    }
    D.addError = (msg) => { D.errors.push({ t: stamp(), msg: String(msg) }); if (D.errors.length > 50) D.errors.shift(); showBanner(); };
    window.addEventListener('error', (e) => {
      const el = e.target;
      if (el && el !== window && (el.src || el.href)) D.addError(`не завантажився ресурс: ${el.src || el.href}`);
      else D.addError(`${e.message || 'помилка'}${e.filename ? ` (${e.filename.split('/').slice(-2).join('/')}:${e.lineno})` : ''}`);
    }, true);
    window.addEventListener('unhandledrejection', (e) => D.addError(`необроблений промис: ${text(e.reason)}`));
    if (diagOn) {
      for (const level of ['log', 'info', 'warn', 'error']) {
        const orig = console[level];
        console[level] = function (...args) {
          try {
            D.log.push({ t: stamp(), level, text: args.map((a) => (typeof a === 'string' ? a : (a instanceof Error ? text(a) : JSON.stringify(a)))).join(' ').slice(0, 300) });
            if (D.log.length > 80) D.log.shift();
            if (level === 'error') D.addError(`console.error: ${D.log[D.log.length - 1].text}`);
          } catch { /* never break logging */ }
          return orig.apply(this, args);
        };
      }
    }
  })();
</script>

<script>
  // Stale-cache guard for the Quest browser: if a newer build is deployed than this (possibly
  // cached) page, reload once with ?v=<new>, a URL no cache has seen. Every module and data URL
  // carries ?v=<version> too (import map above). Versions are set by tools/bump-version.mjs.
  {
    const PAGE_VERSION = '0.19.0';
    // installable app (manifest.webmanifest: full screen, landscape); the worker does nothing with the network (sw.js)
    if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    fetch('version.json?t=' + Date.now(), { cache: 'no-store' }).then((r) => r.json()).then(({ version }) => {
      const url = new URL(location.href);
      if (version && version !== PAGE_VERSION && url.searchParams.get('v') !== version) {
        url.searchParams.set('v', version);
        location.replace(url.href);
      }
    }).catch(() => {});
  }
</script>
