<style>
:root{--navy:#0B2540;--deep:#081B30;--card:#0F2C4C;--line:#234769;--line2:#3A5A80;--paper:#F5EFE4;--muted:#C9D4E3;--dim:#9FB0C6;--yellow:#FFC531;--teal:#6FD3C0;--green:#1E8A5A;--red:#C8423B;--sand:#F4EBDD}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--navy);color:var(--paper);font:17px/1.55 Onest,system-ui,sans-serif}
h1,h2,h3,p{margin:0}
a{color:var(--yellow)}
img{max-width:100%}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sec{padding:76px 0}.deep{background:var(--deep)}
.stack{display:flex;flex-direction:column;gap:24px}
.eyebrow{font:600 13px/1.4 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
.h2{font:400 clamp(32px,5vw,56px)/1.05 "Russo One",sans-serif}
.muted{color:var(--muted)}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:flex;flex-direction:column;gap:10px}
header{position:sticky;top:0;z-index:5;background:rgba(8,27,48,.94);border-bottom:1px solid #1D3B5E}
nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 24px;padding:12px 20px;max-width:1180px;margin:0 auto}
.logo{font:400 22px "Russo One",sans-serif;color:var(--paper);text-decoration:none}.logo span{color:var(--yellow)}
.links{display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px}
.links a{color:#D6DEEA;text-decoration:none;font-weight:500;font-size:15px}.links a:hover{color:var(--yellow)}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}
.lang button{min-width:52px;min-height:40px;border:0;background:transparent;color:#D6DEEA;font:600 14px Onest,sans-serif;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--yellow);color:var(--navy);font-weight:700}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:44px;padding:64px 20px 64px}
.hero .txt{flex:1 1 400px;min-width:0;display:flex;flex-direction:column;gap:20px}
.hero h1{font:400 clamp(64px,11vw,132px)/.9 "Russo One",sans-serif}.hero h1 span{color:var(--yellow)}
.city{font:400 20px "Russo One",sans-serif;letter-spacing:.42em;color:#D6DEEA}
.tagline{font:400 clamp(24px,3vw,32px)/1.2 "Russo One",sans-serif}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 24px;border-radius:14px;font-weight:700;font-size:18px;text-decoration:none}
.btn.main{background:var(--yellow);color:var(--navy)}.btn.ghost{border:2px solid var(--paper);color:var(--paper);font-weight:600}
.hero figure{flex:1 1 440px;min-width:0;margin:0;position:relative}
.hero figure img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:22px;border:3px solid var(--yellow)}
.badge{position:absolute;left:18px;bottom:-18px;display:flex;align-items:baseline;gap:8px;padding:10px 16px;border-radius:12px;background:var(--green);font-family:"Russo One",sans-serif}.badge b{font-size:30px;font-weight:400}
.wave{display:block;width:100%;height:48px;background:var(--sand)}
.num{font:400 44px/1 "Russo One",sans-serif;color:var(--yellow)}
.board{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;border:1px dashed var(--line2);border-radius:16px;padding:20px 24px;background:var(--navy)}
.board .lbl{font:600 12px "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--yellow)}
.board .lines{display:flex;flex-direction:column;gap:6px;font:500 15px "IBM Plex Mono",monospace}
.two{display:flex;flex-wrap:wrap;gap:40px 56px;align-items:flex-start}.two>*{flex:1 1 400px;min-width:0}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden}
.tier .n{font:400 22px "Russo One",sans-serif}.tier .d{font:500 13px "IBM Plex Mono",monospace;color:var(--dim)}
.note{display:flex;gap:14px;background:var(--card);border-radius:14px;padding:18px 20px;font-size:15px;color:#D6DEEA}
.crew{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.crew img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.crew .b{padding:20px 22px 24px;display:flex;flex-direction:column;gap:8px}
.mode{font:600 12px "IBM Plex Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.quote{font:400 17px "Russo One",sans-serif}
.smash{display:flex;justify-content:space-between;align-items:baseline;border-top:3px solid var(--red);padding-top:12px;font-weight:600}.smash b{font:400 22px "Russo One",sans-serif;color:var(--yellow)}
.sand{background:var(--sand);color:var(--navy)}.sand .eyebrow{color:#A1322C}.sand .muted{color:#33445A}
.mark{background:#fff;border:1px solid #E2D4BD;border-radius:16px;padding:18px 20px;display:flex;flex-direction:column;gap:6px}
.mark .t{display:flex;align-items:center;gap:10px}.mark .t span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--yellow);font:400 14px "Russo One",sans-serif}
.mark h3{font-size:17px}.mark p{font-size:15px;color:#33445A}
.tag{flex:none;font:600 11px "IBM Plex Mono",monospace;letter-spacing:.08em;padding:3px 9px;border-radius:999px;border:1px solid;margin-top:3px}
.tag.live{border-color:#2FBF71;color:#5ED897}.tag.test{border-color:var(--yellow);color:var(--yellow)}.tag.soon{border-color:#6C819C;color:#A9B8CC}
.modes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}.modes li{display:flex;gap:14px;align-items:flex-start}
.lvl .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dev ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px;color:#D6DEEA}
.plat{border-top:1px solid var(--line2);padding-top:16px;display:flex;flex-direction:column;gap:6px}
.final{background:var(--yellow);color:var(--navy);padding:72px 0;text-align:center}
.final h2{font:400 clamp(38px,6vw,68px)/1.02 "Russo One",sans-serif}
.final .btn{background:var(--navy);color:var(--yellow)}
footer{padding:28px 0 36px;font-size:13px;color:var(--dim)}footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px 24px}
</style>
</head>
<body>
<header><nav aria-label="Main">
  <a class="logo" href="#top">CRAZY <span>TUK</span></a>
  <div class="links">
    <a href="#how" data-k="navHow"></a><a href="#tips" data-k="navTips"></a><a href="#crew" data-k="navCrew"></a><a href="#levels" data-k="navLevels"></a><a href="#dev" data-k="navDev"></a>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="uk">UA</button></div>
  </div>
</nav></header>

<main>
<section id="top" class="hero wrap">
  <div class="txt">
    <div class="eyebrow" data-k="heroEyebrow"></div>
    <h1>CRAZY<br><span>TUK</span></h1>
    <div class="city" data-k="city"></div>
    <p class="tagline" data-k="tagline"></p>
    <p class="muted" style="max-width:52ch" data-k="pitch"></p>
    <div class="btns">
      <a class="btn main" href="../" data-k="ctaPlay"></a>
      <a class="btn ghost" href="#how" data-k="ctaHow"></a>
    </div>
    <p style="font-size:14px;color:var(--dim)" data-k="platformsLine"></p>
  </div>
  <figure><img src="img/hero.jpg" data-alt="heroAlt" alt=""><div class="badge"><b>120</b><span data-k="kmhNitro"></span></div></figure>
</section>

<svg class="wave" viewBox="0 0 1200 48" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 10 C 100 -2, 200 22, 300 10 S 500 -2, 600 10 S 800 22, 900 10 S 1100 -2, 1200 10" fill="none" stroke="#C8423B" stroke-width="7"/>
  <path d="M0 24 C 100 12, 200 36, 300 24 S 500 12, 600 24 S 800 36, 900 24 S 1100 12, 1200 24" fill="none" stroke="#1B1B1B" stroke-width="7"/>
  <path d="M0 38 C 100 26, 200 50, 300 38 S 500 26, 600 38 S 800 50, 900 38 S 1100 26, 1200 38" fill="none" stroke="#C8423B" stroke-width="7"/>
</svg>

<section id="how" class="sec deep"><div class="wrap stack">
  <div class="eyebrow" data-k="howEyebrow"></div>
  <h2 class="h2" style="max-width:18ch" data-k="howTitle"></h2>
  <div class="grid" id="steps"></div>
  <div class="board"><div class="lbl" data-k="boardLabel"></div><div class="lines" id="board"></div></div>
</div></section>

<section id="tips" class="sec"><div class="wrap two">
  <div class="stack" style="gap:18px">
    <div class="eyebrow" data-k="tipsEyebrow"></div>
    <h2 class="h2" data-k="tipsTitle"></h2>
    <p class="muted" data-k="tipsP1"></p>
    <p class="muted" data-k="tipsP2"></p>
  </div>
  <div class="stack" style="gap:18px">
    <div class="bar" aria-hidden="true"><div style="flex:12;background:#3A5A80"></div><div style="flex:5;background:#6FD3C0"></div><div style="flex:3;background:#FFC531"></div></div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))" id="tiers"></div>
    <div class="note"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFC531" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg><p data-k="nitroNote"></p></div>
  </div>
</div></section>

<section id="crew" class="sec deep"><div class="wrap stack">
  <div class="eyebrow" data-k="crewEyebrow"></div>
  <h2 class="h2" data-k="crewTitle"></h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))" id="crewList"></div>
</div></section>

<section class="sec"><div class="wrap stack">
  <div class="eyebrow" data-k="smashEyebrow"></div>
  <h2 class="h2" style="max-width:20ch" data-k="smashTitle"></h2>
  <p class="muted" style="max-width:64ch" data-k="smashP"></p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))" id="smash"></div>
</div></section>

<section class="sec sand"><div class="wrap stack">
  <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px">
    <div class="stack" style="gap:14px"><div class="eyebrow" data-k="marksEyebrow"></div><h2 class="h2" style="max-width:18ch" data-k="marksTitle"></h2></div>
    <div style="font:500 14px 'IBM Plex Mono',monospace;color:#4A5C72" data-k="marksCount"></div>
  </div>
  <p class="muted" style="max-width:64ch" data-k="marksP"></p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px" id="marks"></div>
</div></section>

<section class="sec"><div class="wrap two">
  <div class="stack" style="gap:18px">
    <div class="eyebrow" data-k="modesEyebrow"></div>
    <h2 class="h2" data-k="modesTitle"></h2>
    <p class="muted" data-k="modesP"></p>
    <ul class="modes" id="modes"></ul>
  </div>
  <figure style="margin:0;display:flex;flex-direction:column;gap:10px"><img src="img/title-phone.jpg" data-alt="titleAlt" alt="" style="border-radius:18px;border:1px solid var(--line)"><figcaption style="font-size:13px;color:var(--dim)" data-k="titleCaption"></figcaption></figure>
</div></section>

<section id="levels" class="sec deep"><div class="wrap stack">
  <div class="eyebrow" data-k="levelsEyebrow"></div>
  <h2 class="h2" data-k="levelsTitle"></h2>
  <p class="muted" style="max-width:64ch" data-k="levelsP"></p>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))" id="levelsList"></div>
</div></section>

<section id="dev" class="sec dev"><div class="wrap stack">
  <div class="eyebrow" data-k="devEyebrow"></div>
  <h2 class="h2" data-k="devTitle"></h2>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:28px">
    <div class="stack" style="gap:12px"><h3 style="font-size:20px;color:var(--teal)" data-k="doneTitle"></h3><ul id="done"></ul></div>
    <div class="stack" style="gap:12px"><h3 style="font-size:20px;color:var(--yellow)" data-k="nextTitle"></h3><ul id="next"></ul></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px">
    <div class="plat"><h3 style="font-size:18px" data-k="phoneName"></h3><p class="muted" style="font-size:15px" data-k="phoneP"></p></div>
    <div class="plat"><h3 style="font-size:18px" data-k="pcName"></h3><p class="muted" style="font-size:15px" data-k="pcP"></p></div>
    <div class="plat"><h3 style="font-size:18px">Meta Quest</h3><p class="muted" style="font-size:15px" data-k="vrP"></p></div>
  </div>
</div></section>

<section class="final"><div class="wrap stack" style="align-items:center;gap:22px">
  <h2 data-k="finalTitle"></h2>
  <a class="btn" href="../" data-k="ctaPlay"></a>
  <p style="max-width:60ch;color:#2B3B50" data-k="finalNote"></p>
</div></section>
</main>

<footer><div class="wrap"><span data-k="footerLeft"></span><span>© OpenStreetMap contributors · © IGN (CNIG)</span></div></footer>

  try { localStorage.setItem('crazytuk.landing.lang', lang); } catch (e) {}
}
